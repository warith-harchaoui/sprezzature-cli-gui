name: ci

# Gentle, deterministic gate: install the package + dev/optional extras,
# then ruff lint + pytest on the supported Python versions. Installing the
# package also exercises the setuptools packaging. Intentionally minimal.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,click,typer]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
