[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-cli-gui"
version = "1.3.0"
description = "Auto-generate a single-file HTML GUI from any Python CLI (argparse, Click, Typer)."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = ["cli", "gui", "argparse", "click", "typer", "html", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Utilities",
]
dependencies = [
    # The command line, and the only parser since 2026-10-25. This package
    # carried no base dependencies; click is the one bought on purpose,
    # because with argparse gone nothing ships with Python that can parse a
    # command line.
    "click>=8.1",

    # ------------------------------------------------- une seule installation
    # Folded in from the extras on 2026-11-01. The base was 1
    # dependency, so `pip install sprezzature-cli-gui` installed almost nothing and
    # did almost nothing: choosing the right extra was a thing a reader had to
    # know before the package could do its job. Across the suite that was 59
    # extras over eleven repositories, six of them with a base of one.
    #
    # The surfaces are not features and they are not optional any more: the
    # HTTP app and the MCP server are two of this package's five front doors,
    # and a door you have to install separately is a door people do not find.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastapi-mcp>=0.3",
    "mcp<2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# mypy belongs here and not only in requirements-dev.txt: this package's
# workflow installs the `dev` extra and never reads that file, so the type
# step it added failed with "mypy: command not found" on the first push.
# starlette 1.9.0 moved its TestClient onto httpx2, and this repository's CI
# installs `.[dev]` without ever reading
# requirements-dev.txt — so the declaration has to be here, where the install
# actually looks. It is a *test* dependency: putting it in `api` would make
# every user of the HTTP surface install it.
dev = ["pytest>=8.0", "ruff", "mypy", "httpx2>=2.0.0"]

[project.scripts]
sprezzature-cli-gui-mcp = "sprezzature_cli_gui.mcp:main"
sprezzature-cli-gui = "sprezzature_cli_gui.cli:main"
# The Click twin. Both front doors build the same namespace and call the same
# handler, so a flag cannot exist on one and be missing from the other — and
# a package that reads Click commands for a living ought to offer one.
# The audit half. This brick promises the page covers the CLI; this is what
# checks it, and it gates a build the way every other brick's lint does.
sprezzature-cli-gui-audit = "sprezzature_cli_gui.audit_cli:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-cli-gui"

[tool.setuptools.packages.find]
include = ["sprezzature_cli_gui*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--strict-markers` because the alternative is a marker that does nothing.
# pytest warns about an unknown mark and then runs the test anyway: a typo in
# `@pytest.mark.slow` reads as a marked test and behaves as an unmarked one.
# It cost sprezzature-accessibility seven LLM tests running in every default
# run for weeks, and that repository is the only one of the nine that had the
# flag. The flag is cheap, it fires at collection, and the whole suite now
# carries it -- scripts/test_the_suite_runs_tests_the_same_way.py in the hub
# checks that it still does.
addopts = "-ra --strict-markers"
