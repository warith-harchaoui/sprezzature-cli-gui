<svg xmlns="http://www.w3.org/2000/svg" width="980" height="784" viewBox="0 0 980 784" font-family="Roboto, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="cli-gui-hiw-title cli-gui-hiw-desc"><title id="cli-gui-hiw-title">How sprezzature-cli-gui works</title><desc id="cli-gui-hiw-desc">Flow diagram. At the top, a command-line tool feeds two lanes, which are two ways of reading it. The left lane imports the module and walks the parser object's own fields, at high fidelity. The right lane runs the tool's own help in a subprocess and reads the printed text, at lower fidelity and saying so. Both meet in one outcome, a single normalised description that the renderer turns into one self-contained HTML page.</desc><style>@media (prefers-color-scheme: dark){rect[fill="#FFFFFF"]{fill:#141416;}rect.paper{fill:#0B0B0C;}[fill="#1D1D1F"]{fill:#F2F2F7;}[fill="#6E6E73"]{fill:#9C9CA3;}[stroke="#1D1D1F"]{stroke:#F2F2F7;}[stroke="#C7C7CC"]{stroke:#5A5A5E;}[fill="#C7C7CC"]{fill:#5A5A5E;}rect[fill="#CCE4FF"]{fill:#082646;}rect[fill="#FFEACC"]{fill:#462C09;}}</style><rect class="paper" width="980" height="784" fill="#FFFFFF"/><text x="36" y="52" font-size="28" font-weight="700" fill="#1D1D1F">How sprezzature-cli-gui works</text><text x="36" y="80" font-size="16" font-weight="400" fill="#6E6E73">A tool somebody will not type, read from its own declarations and handed back as a form.</text><rect x="36" y="104" width="908" height="68" rx="12" fill="#FFFFFF" stroke="#8E8E93" stroke-width="1.6" stroke-dasharray="6 5"/><text x="54" y="133" font-size="16" font-weight="600" fill="#1D1D1F">A command-line tool</text><text x="54" y="157" font-size="13.5" font-weight="400" fill="#6E6E73">argparse, Click or Typer in Python. Anything else, cobra in Go, clap in Rust, through its own help text.</text><path d="M490,172 V192 H254 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,204 L254,212 L258,204" fill="#C7C7CC"/><path d="M490,172 V192 H726 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,204 L726,212 L730,204" fill="#C7C7CC"/><rect x="36" y="212" width="436" height="30" rx="12" fill="#CCE4FF"/><path d="M38,220 v14" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="64" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Read the parser object</text><rect x="36" y="258" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Resolve module:factory down to the parser</text><text x="54" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">an importable module, or a path to a script, plus the name</text><text x="54" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">of the function that builds the parser</text><path d="M254,342 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,358 L254,366 L258,358" fill="#C7C7CC"/><rect x="36" y="366" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="396" font-size="16" font-weight="600" fill="#1D1D1F">Walk the fields it already declares</text><text x="54" y="420" font-size="13.5" font-weight="400" fill="#6E6E73">sub-commands, flags, types, defaults, allowed values, help</text><text x="54" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">strings. Nothing is guessed from printed text.</text><path d="M254,452 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,468 L254,476 L258,468" fill="#C7C7CC"/><rect x="36" y="476" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><path d="M38,488 v61" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="504" font-size="16" font-weight="600" fill="#1D1D1F">High fidelity</text><text x="65" y="528" font-size="13.5" font-weight="400" fill="#6E6E73">a parser knows what a help text only hints at, which is why</text><text x="65" y="546" font-size="13.5" font-weight="400" fill="#6E6E73">this path is tried first</text><rect x="508" y="212" width="436" height="30" rx="12" fill="#FFEACC"/><path d="M510,220 v14" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="536" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Or read the help text</text><rect x="508" y="258" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Run the tool's own help in a subprocess</text><text x="526" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">which works against a command line written in any language</text><text x="526" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">at all, including one that is not Python</text><path d="M726,342 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,358 L726,366 L730,358" fill="#C7C7CC"/><rect x="508" y="450" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><path d="M510,462 v78" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="537" y="479" font-size="16" font-weight="600" fill="#1D1D1F">Lower fidelity, and it says so</text><text x="537" y="503" font-size="13.5" font-weight="400" fill="#6E6E73">the fallback for when no parser object can be reached. A help</text><text x="537" y="520" font-size="13.5" font-weight="400" fill="#6E6E73">text says less than a parser knows, and that difference</text><text x="537" y="538" font-size="13.5" font-weight="400" fill="#6E6E73">shows up in the form.</text><path d="M254,560 V582 H490 V594" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,594 L490,602 L494,594" fill="#C7C7CC"/><path d="M726,560 V582 H490 V594" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,594 L490,602 L494,594" fill="#C7C7CC"/><rect x="36" y="602" width="908" height="102" rx="12" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.6"/><path d="M38,614 v78" stroke="#1D1D1F" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="632" font-size="16" font-weight="600" fill="#1D1D1F">One normalised description, then one self-contained page</text><text x="65" y="656" font-size="13.5" font-weight="400" fill="#6E6E73">Both lanes produce the same schema, so the renderer never learns which framework it came from. Every sub-command becomes</text><text x="65" y="673" font-size="13.5" font-weight="400" fill="#6E6E73">a section and every flag a field, in semantic HTML, Tailwind utilities and plain JavaScript modules. No framework runtime, no build step,</text><text x="65" y="690" font-size="13.5" font-weight="400" fill="#6E6E73">one file.</text><text x="36" y="731" font-size="13.5" font-weight="400" fill="#6E6E73">The page assembles the exact command line as text, in the visitor's browser, and stops there. Running it stays a copy and paste, a Tauri</text><text x="36" y="748" font-size="13.5" font-weight="400" fill="#6E6E73">invoke, or a FastAPI endpoint, which is somebody else's decision.</text></svg>
